name: Release Android

# Push the tag v<FLARE_VERSION> (see version.properties) from main to build, sign and publish the Android APKs for direct download.
# Each exchange is its own app (product flavor); this builds and ships both, decibel and hyperliquid.
# Signing secrets live in the android-release environment, which only v* tags can use and which
# waits for approval before each run.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

env:
  # Every published APK must carry this signing certificate (SHA-256, lowercase hex).
  EXPECTED_CERT_SHA256: b05e699cc7f2967ff2fd27ff0966c32915367b09032dcf56f74296a97ba40090

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-release
    env:
      # Both come from the android-release environment's variables, so they change without code:
      # the HTTPS Worker the app talks to, and the address that receives Flare's builder fee.
      FLARE_WORKER_URL: ${{ vars.FLARE_WORKER_URL }}
      FLARE_BUILDER_ADDRESS: ${{ vars.FLARE_BUILDER_ADDRESS }}
      # Hyperliquid still ships on testnet; Decibel is mainnet-only. Its builder is optional:
      # unset, the app offers no builder fee.
      FLARE_HYPERLIQUID_NETWORK: testnet
      FLARE_HYPERLIQUID_BUILDER_ADDRESS: ${{ vars.FLARE_HYPERLIQUID_BUILDER_ADDRESS }}
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag against version.properties
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(sed -n 's/^FLARE_VERSION *= *//p' version.properties | tr -d '[:space:]')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::FLARE_VERSION in version.properties must look like 1.2.3 (minor and patch below 100), got '$version'"; exit 1
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match version.properties ($version); push v$version or change the file"; exit 1
          fi
          # Only release what is already on main.
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag is not on main"; exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Check the release configuration
        run: |
          if [[ ! "$FLARE_WORKER_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::Set FLARE_WORKER_URL (an https:// URL) in the android-release environment"; exit 1
          fi
          if [[ ! "$FLARE_BUILDER_ADDRESS" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Set FLARE_BUILDER_ADDRESS (0x and 64 hex digits) in the android-release environment"; exit 1
          fi
          if [[ -n "$FLARE_HYPERLIQUID_BUILDER_ADDRESS" && ! "$FLARE_HYPERLIQUID_BUILDER_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "::error::FLARE_HYPERLIQUID_BUILDER_ADDRESS must be empty or 0x and 40 hex digits"; exit 1
          fi
          echo "Worker: $FLARE_WORKER_URL"
          echo "Builder: $FLARE_BUILDER_ADDRESS"
          echo "Hyperliquid: $FLARE_HYPERLIQUID_NETWORK, builder ${FLARE_HYPERLIQUID_BUILDER_ADDRESS:-none}"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: >-
          ./gradlew
          :strategies:jvmTest
          :jev:jvmTest
          :decibel:jvmTest
          :hyperliquid:jvmTest
          :hyperliquid:testAndroidHostTest
          :shared:testAndroidHostTest
          :venue-decibel:testAndroidHostTest
          :venue-hyperliquid:testAndroidHostTest
          :androidApp:lintDecibelRelease
          :androidApp:lintHyperliquidRelease

      - name: Build the signed APKs
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ORG_GRADLE_PROJECT_flareKeystorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_flareKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_flareKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/flare-release.keystore"
          echo "$KEYSTORE_B64" | base64 --decode > "$keystore"
          ./gradlew :androidApp:assembleDecibelRelease :androidApp:assembleHyperliquidRelease \
            -PflareKeystoreFile="$keystore" \
            -PflareWorkerUrl="$FLARE_WORKER_URL" \
            -PflareBuilderAddress="$FLARE_BUILDER_ADDRESS" \
            -PflareHyperliquidNetwork="$FLARE_HYPERLIQUID_NETWORK" \
            -PflareHyperliquidBuilderAddress="$FLARE_HYPERLIQUID_BUILDER_ADDRESS"
          rm -f "$keystore"

      - name: Check the APKs before they ship
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          has_string() {
            "$tools/aapt2" dump resources "$1" | grep -A1 "string/$2" | grep -q "\"$3\""
          }
          mkdir dist
          for flavor in decibel hyperliquid; do
            apk="androidApp/build/outputs/apk/$flavor/release/androidApp-$flavor-release.apk"
            "$tools/apksigner" verify --print-certs "$apk" > signers.txt
            cert=$(grep -m1 "certificate SHA-256 digest" signers.txt | awk '{print $NF}')
            if [[ "$cert" != "$EXPECTED_CERT_SHA256" ]]; then
              echo "::error::$flavor is signed with $cert, expected $EXPECTED_CERT_SHA256"; exit 1
            fi
            "$tools/aapt2" dump badging "$apk" | grep -q "versionName='$VERSION_NAME'" \
              || { echo "::error::$flavor version mismatch"; exit 1; }
            "$tools/aapt2" dump badging "$apk" | grep -q "package: name='xyz.mcxross.flare.$flavor'" \
              || { echo "::error::The $flavor APK has the wrong application ID"; exit 1; }
            cp "$apk" "dist/flare-$flavor-$VERSION_NAME.apk"
            # A stable name, so /releases/latest/download/flare-<flavor>-android.apk always serves the newest.
            cp "$apk" "dist/flare-$flavor-android.apk"
          done
          decibel=dist/flare-decibel-android.apk
          if [[ "$FLARE_WORKER_URL" == *testnet* ]]; then
            echo "::error::Decibel is mainnet-only; FLARE_WORKER_URL still names a testnet host"
            exit 1
          fi
          has_string "$decibel" flare_worker_url "$FLARE_WORKER_URL" \
            || { echo "::error::The Decibel APK does not point at $FLARE_WORKER_URL"; exit 1; }
          has_string "$decibel" flare_builder_address "$FLARE_BUILDER_ADDRESS" \
            || { echo "::error::The Decibel APK does not carry builder $FLARE_BUILDER_ADDRESS"; exit 1; }
          hyperliquid=dist/flare-hyperliquid-android.apk
          has_string "$hyperliquid" flare_hyperliquid_network "$FLARE_HYPERLIQUID_NETWORK" \
            || { echo "::error::The Hyperliquid APK is not on $FLARE_HYPERLIQUID_NETWORK"; exit 1; }
          has_string "$hyperliquid" flare_hyperliquid_builder_address "$FLARE_HYPERLIQUID_BUILDER_ADDRESS" \
            || { echo "::error::The Hyperliquid APK does not carry builder '$FLARE_HYPERLIQUID_BUILDER_ADDRESS'"; exit 1; }
          cd dist
          for apk in *.apk; do sha256sum "$apk" > "$apk.sha256"; done
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Save the verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: flare-android-${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Attest where the APKs came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.apk

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Install

          Each exchange is its own app. Download the one you trade on below and open it on your phone. Android asks once to allow installs from your browser.

          - Decibel: \`flare-decibel-android.apk\`
          - Hyperliquid (${FLARE_HYPERLIQUID_NETWORK}): \`flare-hyperliquid-android.apk\`

          Build: \`${GITHUB_SHA}\` ([CI run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})).

          ## Verify

          - SHA-256 checksums are in \`SHA256SUMS\` and next to each APK (\`.sha256\`).
          - Signing certificate SHA-256: \`${EXPECTED_CERT_SHA256}\`
          - Build provenance: \`gh attestation verify flare-hyperliquid-android.apk --repo ${GITHUB_REPOSITORY}\` (likewise for Decibel)
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Flare ${{ steps.version.outputs.name }}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
